name: Build Mineclonia Texture Pack

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a full rebuild + release even if nothing changed upstream"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --- Script 1: cheap check, no cloning ---
      - name: Check for a new upstream release
        id: check
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python scripts/01_check_release.py

      # --- Script 2: clone/reset, strip to pngs, diff texture hash ---
      - name: Build texture pack from latest release
        id: build
        if: steps.check.outputs.new_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
        run: python scripts/02_build_texturepack.py

      # --- Script 3: zip, bump version, publish release ---
      - name: Publish release
        id: publish
        if: steps.check.outputs.new_release == 'true' && steps.build.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.check.outputs.tag }}
          TEXTURE_HASH: ${{ steps.build.outputs.texture_hash }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/03_publish_release.py

      # --- Persist the updated release-cache.json ---
      - name: Commit updated release-cache.json
        if: steps.check.outputs.new_release == 'true' && steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release-cache.json assets/LICENSE.txt
          git commit -m "Release v${{ steps.publish.outputs.new_version }} (from Mineclonia ${{ steps.check.outputs.tag }})"
          git push
